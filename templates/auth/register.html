{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#051324" />
  <title>Create Account - SeedVault</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml" />
  <link rel="alternate icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon" />
  <link rel="stylesheet" href="{% static 'css/auth-clean.css' %}?v=20261109a" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
<body class="auth-clean-body">

  <!-- Top-Left Floating Badge -->
  <aside class="sprout-live-tag">
    <span class="sprout-live-dot" aria-hidden="true"></span>
    <span>SeedVault &bull; Agricultural Seed Repository</span>
  </aside>

  <!-- Register Card (Positioned on the Right Side) -->
  <main class="auth-clean-card">
    <div class="card-header-block">
      <div class="card-brand-logo">
        <div class="brand-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 4 13C4 7 11 3 20 3C20 12 16 20 11 20Z"/>
            <path d="M4 20L11 13"/>
          </svg>
        </div>
        <h1 class="brand-name">Seed<span>Vault</span></h1>
      </div>
      <p class="card-subtitle">Create a new <b>SeedVault</b> account</p>
    </div>

    {% if errors %}
      <div class="auth-alert-box" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <div>
          {% for field, error in errors.items %}
            <div>{{ error }}</div>
          {% endfor %}
        </div>
      </div>
    {% endif %}

    <form method="post" novalidate autocomplete="on">
      {% csrf_token %}

      <!-- Username -->
      <div class="field-block">
        <label class="field-label" for="reg_username">Username</label>
        <div class="field-pill">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
          </span>
          <input 
            type="text" 
            name="username" 
            id="reg_username" 
            class="field-input" 
            placeholder="Choose a username" 
            value="{{ form_data.username|default:'' }}"
            required 
            autocomplete="username">
        </div>
      </div>

      <!-- First & Last Name Grid -->
      <div class="field-grid-2">
        <div class="field-block">
          <label class="field-label" for="reg_first_name">First Name</label>
          <div class="field-pill">
            <input 
              type="text" 
              name="first_name" 
              id="reg_first_name" 
              class="field-input" 
              placeholder="First name" 
              value="{{ form_data.first_name|default:'' }}"
              required>
          </div>
        </div>

        <div class="field-block">
          <label class="field-label" for="reg_last_name">Last Name</label>
          <div class="field-pill">
            <input 
              type="text" 
              name="last_name" 
              id="reg_last_name" 
              class="field-input" 
              placeholder="Last name" 
              value="{{ form_data.last_name|default:'' }}"
              required>
          </div>
        </div>
      </div>

      <!-- Email -->
      <div class="field-block">
        <label class="field-label" for="reg_email">Email Address</label>
        <div class="field-pill">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </span>
          <input 
            type="email" 
            name="email" 
            id="reg_email" 
            class="field-input" 
            placeholder="e.g. student@kcc.edu.ph" 
            value="{{ form_data.email|default:'' }}"
            required 
            autocomplete="email">
        </div>
      </div>

      <!-- Password Grid -->
      <div class="field-grid-2">
        <div class="field-block">
          <label class="field-label" for="reg_password">Password</label>
          <div class="field-pill">
            <input 
              type="password" 
              name="password" 
              id="reg_password" 
              class="field-input" 
              placeholder="At least 8 chars" 
              required 
              autocomplete="new-password">
          </div>
        </div>

        <div class="field-block">
          <label class="field-label" for="reg_confirm_password">Confirm</label>
          <div class="field-pill">
            <input 
              type="password" 
              name="confirm_password" 
              id="reg_confirm_password" 
              class="field-input" 
              placeholder="Repeat password" 
              required 
              autocomplete="new-password">
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-auth-submit" style="margin-top: 10px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        <span>Create Account</span>
      </button>
    </form>

    <div class="form-footer-switch">
      Already have an account? <a href="{% url 'login' %}">Sign in here</a>
    </div>
  </main>

</body>
</html>
